name: Backend & Database CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - development

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      SECRET_KEY: GitHub-Actions-CI
      ALLOWED_HOSTS: localhost
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8000,http://localhost

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12.2

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check if missing migrations
        run: |
          python manage.py makemigrations --check --settings=backend.settings_test

      - name: Run Tests
        run: |
          python manage.py test --settings=backend.settings_test