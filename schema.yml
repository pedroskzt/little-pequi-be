components:
  schemas:
    Activation:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
      required:
      - token
      - uid
    Category:
      type: object
      description: Serializer for the category model
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 255
      required:
      - id
      - slug
      - title
    MenuItem:
      type: object
      description: Serializer for the menu item model
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        featured:
          type: boolean
        delivery:
          type: boolean
        image:
          type: string
          format: uri
        category:
          type: array
          items:
            type: integer
      required:
      - category
      - delivery
      - featured
      - id
      - image
      - price
      - title
    PasswordResetConfirm:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
        new_password:
          type: string
      required:
      - new_password
      - token
      - uid
    PatchedCategory:
      type: object
      description: Serializer for the category model
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 255
    PatchedMenuItem:
      type: object
      description: Serializer for the menu item model
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        featured:
          type: boolean
        delivery:
          type: boolean
        image:
